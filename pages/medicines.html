<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأدوية - صيدلية الشفاء</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="../css/style.css"></head><body data-protected="true"><main class="app-shell"><section class="window"><div class="window-bar"><h1>إدارة الأدوية</h1><span class="bar-mark" data-pharmacy-name>صيدلية الشفاء</span></div><div class="page-body"><div class="toolbar no-print"><a class="btn btn-system" href="dashboard.html">رجوع</a><button class="btn btn-system" onclick="logout()">تسجيل خروج</button></div><h2 class="page-title">تسجيل دواء</h2><div data-message class="alert-system mb-3"></div><form id="medicineForm" class="form-panel" novalidate><input type="hidden" id="medicineId"><div class="row g-3"><div class="col-md-6"><label class="form-label">اسم الدواء *</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">التصنيف *</label><select class="form-select" id="category" name="category" required></select></div><div class="col-md-3"><label class="form-label">الكمية *</label><input class="form-control" name="quantity" type="number" min="0" required></div><div class="col-md-3"><label class="form-label">سعر الشراء</label><input class="form-control" name="purchasePrice" type="number" min="0"></div><div class="col-md-3"><label class="form-label">سعر البيع</label><input class="form-control" name="salePrice" type="number" min="0"></div><div class="col-md-3"><label class="form-label">تاريخ الانتهاء</label><input class="form-control" name="expiry" type="date"></div><div class="col-md-6"><label class="form-label">المورد</label><input class="form-control" name="supplier"></div></div><div class="toolbar mt-4 mb-0 no-print"><button id="medicineSaveBtn" class="btn btn-system btn-primary-system">حفظ</button><button type="reset" class="btn btn-system" onclick="document.getElementById('medicineId').value='';document.getElementById('medicineSaveBtn').textContent='حفظ'">مسح</button></div></form><div class="table-panel"><div class="toolbar no-print"><h2 class="page-title flex-grow-1 mb-0">سجل الأدوية</h2><input id="medicineSearch" class="form-control" style="max-width:300px" placeholder="بحث بالاسم أو التصنيف"><button class="btn btn-system" onclick="printMedicines()">طباعة</button></div><div class="table-responsive"><table class="table table-bordered table-system"><thead><tr><th>رقم</th><th>اسم الدواء</th><th>التصنيف</th><th>الكمية</th><th>سعر الشراء</th><th>سعر البيع</th><th>الانتهاء</th><th>المورد</th><th class="no-print">الإجراءات</th></tr></thead><tbody id="medicineBody"></tbody></table></div></div></div></section></main><script src="../js/app.js"></script></body></html>
