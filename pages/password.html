<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة المرور - صيدلية الشفاء</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="../css/style.css"></head><body data-protected="true"><main class="app-shell"><section class="window"><div class="window-bar"><h1>تغيير كلمة المرور</h1><span class="bar-mark" data-pharmacy-name>صيدلية الشفاء</span></div><div class="page-body"><div class="toolbar no-print"><a class="btn btn-system" href="dashboard.html">رجوع</a><button class="btn btn-system" onclick="logout()">تسجيل خروج</button></div><h2 class="page-title">تغيير كلمة المرور</h2><div data-message class="alert-system mb-3"></div><div class="settings-panel" style="max-width:650px;margin-inline:auto"><img class="preview-image mx-auto mb-4" style="width:150px;height:150px" src="../assets/default-user.png" alt="المستخدم"><form id="passwordForm"><div class="mb-3"><label class="form-label" for="currentPassword">كلمة المرور الحالية</label><input class="form-control" id="currentPassword" type="password" required></div><div class="mb-3"><label class="form-label" for="newPassword">كلمة المرور الجديدة</label><input class="form-control" id="newPassword" type="password" minlength="4" required></div><div class="mb-3"><label class="form-label" for="confirmPassword">تأكيد كلمة المرور</label><input class="form-control" id="confirmPassword" type="password" required></div><button class="btn btn-system btn-primary-system">حفظ</button></form></div></div></section></main><script src="../js/app.js"></script></body></html>
